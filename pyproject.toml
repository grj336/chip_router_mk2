[project]
name = "chip-router-mk2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.8",
    "torch>=2.1.0",
    "numpy",
    "networkx",
    "gymnasium",
    "ruff>=0.15.1",
    "pytest",
    "torch-geometric>=2.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["your_package"]

[dependency-groups]
dev = [
    "ruff",
    "pre-commit",
]
